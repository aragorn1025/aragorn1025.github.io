name: deployment

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            fontconfig \
            texlive-xetex \
            texlive-latex-extra
          sudo fc-cache -f -v
          npm ci
      - name: Build Website
        run: npm run build
      - name: Generate Resume PDF
        working-directory: src/latex
        run: |
          xelatex -interaction=nonstopmode -halt-on-error resume.tex
      - name: Copy Resume PDF
        run: |
          mkdir -p dist/resume
          cp src/latex/resume.pdf dist/resume/resume.pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
