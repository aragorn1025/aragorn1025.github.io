name: deploy

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: ${{ github.repository }}
  AUTHOR_NAME: "Aragorn Dai"

jobs:
  check-dockerfile:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check if Dockerfile has changed
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'

  build-image:
    needs: check-dockerfile
    if: needs.check-dockerfile.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-website:
    needs: [check-dockerfile, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Website
        run: npm run build
      - name: Generate Resume PDF
        working-directory: src/latex
        run: |
          xelatex -interaction=nonstopmode -halt-on-error resume.tex
      - name: Copy Resume PDF
        run: |
          cp src/latex/resume.pdf "dist/${{ env.AUTHOR_NAME }}_Resume.pdf"
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build-website
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
